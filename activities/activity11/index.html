<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Activity 11</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 
<h1>Create Loops</h1>
 
<div class="container">
 
 
    <div class="box">
        <h3>For Loop</h3>
        Enter number: <input type="number" id="forNum"><br>
        Enter text: <input type="text" id="forText"><br>
        <button onclick="showFor()">Show</button>
        <button onclick="clearFor()">Clear</button>
        <div id="forOutput"></div>
    </div>
 
   
    <div class="box">
        <h3>While Loop</h3>
        Enter number: <input type="number" id="whileNum"><br>
        Enter text: <input type="text" id="whileText"><br>
        <button onclick="showWhile()">Show</button>
        <button onclick="clearWhile()">Clear</button>
        <div id="whileOutput"></div>
    </div>
 
   
    <div class="box">
        <h3>Do-While Loop</h3>
        Enter number: <input type="number" id="doNum"><br>
        Enter text: <input type="text" id="doText"><br>
        <button onclick="showDoWhile()">Show</button>
        <button onclick="clearDoWhile()">Clear</button>
        <div id="doOutput"></div>
    </div>
 
</div>
 
<script src="script.js"></script>
</body>
</html>
