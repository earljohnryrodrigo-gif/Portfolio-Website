<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Contact Us - Earl's Snack House</title>
  <link rel="stylesheet" href="contact.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Nunito:wght@400;600;700;800&display=swap"
    rel="stylesheet">
</head>

<body>

  <nav class="inner-nav">
    <a href="index.html" target="_parent">Home</a>
    <a href="product.html" target="_parent">Products</a>
    <a href="about.html" target="_parent">About Us</a>
    <a href="contact.html" target="_parent">Contact</a>
  </nav>

  <div class="page-header">
    <h1>Get in Touch</h1>
    <p>Message us anytime</p>
  </div>

  <div class="contact-content">

    <div class="map-section">
      <h2>🗺️ Find Us Here</h2>
      <div class="mapouter">
        <div class="gmap_canvas">
          <iframe class="gmap_iframe" frameborder="0" scrolling="no" marginheight="0" marginwidth="0"
            src="https://maps.google.com/maps?width=600&amp;height=400&amp;hl=en&amp;q=basak pardo cebu city&amp;t=h&amp;z=14&amp;ie=UTF8&amp;iwloc=B&amp;output=embed"></iframe>
          <a href="https://embed-googlemap.com">google maps embed</a>
        </div>
        <style>
          .mapouter {
            position: relative;
            text-align: right;
            width: 100%;
            height: 300px;
          }

          .gmap_canvas {
            overflow: hidden;
            background: none !important;
            width: 100%;
            height: 300px;
          }

          .gmap_iframe {
            width: 100% !important;
            height: 300px !important;
          }
        </style>
      </div>
    </div>
    <div class="contact-grid">

      <div class="info-cards">
        <div class="info-card">
          <span>📞</span>
          <strong>Phone</strong>
          <p>0992-858-4191</p>
        </div>
        <div class="info-card">
          <span>✉️</span>
          <strong>Email</strong>
          <p>earlssnackhouse@gmail.com</p>
        </div>
        <div class="info-card">
          <span>🕒</span>
          <strong>Hours</strong>
          <p>Mon-Sat<br>9AM - 8PM</p>
        </div>
      </div>

      <div class="form-box">
        <h2>Send Us a Message</h2>
        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" placeholder="e.g. Juan Dela Cruz" required>
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="message">Your Message</label>
          <textarea id="message" rows="5" placeholder="Write your message here..." required></textarea>
        </div>
        <button type="submit" class="send-btn">Send Message 📨</button>
      </div>

    </div>

  </div>

</body>

</html>
